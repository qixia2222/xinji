<style>
:root{--ink:#334036;--green:#52775b;--soft:#e5f1e3;--bg:#fafbf8;--line:#e6ebe3;--muted:#7b867b;--card:#fff;--accent:#f7e9d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{display:flex;min-height:100vh}.side{position:fixed;width:214px;inset:0 auto 0 0;padding:25px 14px;background:#fcfdfb;border-right:1px solid var(--line);z-index:10}.brand{font-size:22px;font-weight:800;margin:0 9px 28px}.brand i{font-style:normal;display:inline-grid;place-items:center;width:31px;height:31px;border-radius:10px;background:#dcebd9;color:var(--green);margin-right:7px}.nav{width:100%;border:0;background:transparent;border-radius:11px;padding:11px 12px;text-align:left;color:#758075;cursor:pointer;margin:2px 0;font:inherit}.nav.on{color:#416a4b;background:var(--soft);font-weight:700}.main{margin-left:214px;width:calc(100% - 214px);max-width:1450px;padding:38px min(6vw,78px) 80px}.page{display:none}.page.on{display:block}.ey{font-size:11px;letter-spacing:1.3px;color:#909990;font-weight:700;margin:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:start}.top h1{font-size:29px;line-height:1.32;margin:5px 0}.hero{margin:22px 0;padding:31px 36px;border-radius:25px;background:linear-gradient(115deg,#edf6eb,#dcebd8);display:flex;gap:18px;align-items:center;justify-content:space-between}.hero h2{font-size:23px;line-height:1.45;max-width:720px;margin:7px 0}.ring{width:122px;height:122px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#edf5eb 56%,transparent 57%),conic-gradient(var(--green) var(--p),#c9dfc8 0);color:var(--green);font-size:23px;font-weight:800;flex:none}.btn{border:0;border-radius:10px;background:var(--green);color:#fff;padding:10px 15px;font-weight:700;cursor:pointer;font:inherit}.btn.alt{background:#8b6e56}.btn.light{background:#edf4eb;color:#476d50}.btn.danger{background:#f8e9e7;color:#9b5751}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.box{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px}.box b.big{display:block;font-size:25px;margin:5px 0}.tiny{font-size:12px;color:var(--muted)}.bar{height:7px;background:#edf0ec;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px;background:#91bd94}.empty{padding:31px 15px;text-align:center;border:1px dashed #ced9cc;border-radius:14px;color:var(--muted);background:#fcfdfb}.empty b{display:block;color:var(--green);font-size:16px;margin-bottom:5px}.blind{padding:21px;border-radius:19px;background:linear-gradient(110deg,#fff8ee,#f5e9da);border:1px solid #f0dfc8;margin:18px 0}.blind h3{font-size:20px;margin:5px 0}.blind-card{margin-top:12px;background:#fffdf9;border-radius:13px;padding:14px;max-width:700px}.blind-card img,.review-card img{max-width:100%;max-height:210px;border-radius:10px;margin:8px 0;object-fit:contain}.creative{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.candy{font-size:28px;letter-spacing:2px}.monster{font-size:33px}.review-card{max-width:720px;margin:24px auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;min-height:310px}.review-card h2{margin:28px 0 15px;font-size:24px}.answer{display:none;border-top:1px solid var(--line);margin-top:15px;padding-top:15px;color:#466f4d}.rate{text-align:center;margin:16px}.rate button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;margin:4px;cursor:pointer;font:inherit}.rate button:first-child{background:#eef6ed;color:#426d4b}.quote{padding:14px 16px;border-radius:13px;background:#faf0f7;color:#6d536a;margin:10px 0}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 10px}.search{border:1px solid var(--line);border-radius:10px;padding:10px;width:min(260px,100%);background:#fff;font:inherit}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.filters select,.form input,.form textarea,.form select,.plan-form input,.plan-form select{width:100%;border:1px solid #dfe6dc;border-radius:10px;padding:10px;background:#fff;color:var(--ink);font:inherit}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form .wide{grid-column:1/-1}.form textarea{min-height:85px;resize:vertical}.photo-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{border:1px dashed #aac3aa;border-radius:13px;padding:13px;text-align:center;background:#fbfdfb}.photo input{display:none}.photo label{display:block;color:var(--green);font-weight:700;cursor:pointer}.photo img{max-width:100%;height:125px;object-fit:cover;border-radius:9px;margin-top:8px}.card-row{padding:15px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}.card-row:last-child{border:0}.card-row .content{flex:1}.thumbs{display:flex;gap:4px}.thumbs img{width:44px;height:58px;object-fit:cover;border-radius:7px}.pill{display:inline-block;background:#edf5eb;color:#507356;border-radius:999px;padding:3px 8px;font-size:11px;margin:3px 3px 0 0}.actions{display:flex;gap:6px;flex-wrap:wrap}.textBtn{border:1px solid var(--line);background:#fff;color:#607063;border-radius:8px;padding:6px 9px;cursor:pointer;font:inherit;font-size:12px}.analytics{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.bars{height:140px;display:flex;align-items:flex-end;gap:5px;border-bottom:1px solid var(--line);padding-bottom:3px}.bars i{display:block;flex:1;border-radius:5px 5px 0 0;background:#8fba92;min-width:7px}.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}.heat i{aspect-ratio:1;border-radius:4px;background:#edf1ec}.subject-row{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.subject-row>div:first-child{flex:1}.mini-ring{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;margin:12px auto;background:radial-gradient(circle,#fff 56%,transparent 57%),conic-gradient(var(--green) var(--p),#e3ece2 0);color:var(--green);font-size:20px;font-weight:800}.diary-entry{padding:14px;border:1px solid var(--line);border-radius:13px;margin:10px 0;background:#fff}.diary-entry p{white-space:pre-wrap;margin-bottom:0}.mode{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.mode button,.period button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;cursor:pointer;font:inherit}.mode button.on{background:var(--soft);color:#456d4e;font-weight:700}.period{display:flex;gap:8px;align-items:center;margin:10px 0}.period strong{flex:1;text-align:center}.plan-form{display:grid;grid-template-columns:145px 1fr 100px auto;gap:8px;margin:14px 0}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(125px,1fr));gap:8px;min-width:875px}.month-grid{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));gap:7px;min-width:735px}.scroll{overflow:auto;padding-bottom:5px}.plan-cell{border:1px solid var(--line);border-radius:12px;min-height:150px;padding:9px;background:#fff}.plan-cell.today{border:2px solid #9dc69f}.plan-task{font-size:11px;border-radius:6px;padding:5px;margin:5px 0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plan-task.done{text-decoration:line-through;opacity:.55}.add-cell{width:100%;border:1px dashed #b7cdb7;background:#fbfdfb;color:#597a5d;border-radius:7px;padding:5px;font-size:11px;cursor:pointer}.year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.history{margin-top:15px;background:#fbfcfa;border:1px solid var(--line);border-radius:14px;padding:14px}.history-row{display:flex;gap:9px;border-bottom:1px solid var(--line);padding:8px 0;font-size:12px}.history-row time{color:var(--muted);min-width:78px}.pager{text-align:right;margin-top:10px}.pager button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 8px;margin-left:4px}.more-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.notice{padding:10px;border-radius:10px;background:#f8f4ed;color:#75614f;font-size:12px}
@media(max-width:760px){body{padding-bottom:72px}.side{top:auto;width:100%;height:72px;display:flex;align-items:stretch;padding:6px 2px;border-top:1px solid var(--line);border-right:0;background:rgba(252,253,251,.97);backdrop-filter:blur(12px)}.brand{display:none}.nav{font-size:10px;text-align:center;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center}.nav:before{font-size:20px;line-height:20px}.nav:nth-of-type(1):before{content:"⌂"}.nav:nth-of-type(2):before{content:"◌"}.nav:nth-of-type(3):before{content:"▣"}.nav:nth-of-type(4):before{content:"⌁"}.nav:nth-of-type(5):before{content:"♡"}.nav:nth-of-type(6):before{content:"□"}.nav:nth-of-type(7):before{content:"⚙"}.main{margin:0;width:100%;padding:24px 14px 30px}.top h1{font-size:24px}.hero{padding:23px 20px}.hero h2{font-size:19px}.ring{display:none}.grid,.creative,.analytics,.more-grid{grid-template-columns:1fr}.form,.photo-pair{grid-template-columns:1fr}.plan-form{grid-template-columns:1fr}.year-grid{grid-template-columns:repeat(2,1fr)}.period strong{font-size:12px}.period button{font-size:11px;padding:7px}.search{width:100%}}
</style>
</head>
<body><div class="app"><aside class="side"><div class="brand"><i>心</i>心记</div>
<button class="nav on" onclick="go('home',this)">今日</button><button class="nav" onclick="go('review',this)">复习</button><button class="nav" onclick="go('cards',this)">内容库</button><button class="nav" onclick="go('report',this)">报告</button><button class="nav" onclick="go('diary',this)">日记</button><button class="nav" onclick="go('plans',this)">计划</button><button class="nav" onclick="go('more',this)">设置</button></aside>
<main class="main">
<section id="home" class="page on"></section><section id="review" class="page"></section><section id="cards" class="page"></section><section id="report" class="page"></section><section id="diary" class="page"></section><section id="plans" class="page"></section><section id="more" class="page"></section>
</main></div>
<script>
const DB='xinji_v2',STORE='app',IMG='images',LEGACY='xinji-personal-v1';
let state,activeCardId=null,extraMode=false,cardDraft={front:null,back:null,frontUrl:'',backUrl:'',editing:null},planMode='day',planFocus=new Date(),historyPages={day:0,week:0,month:0,year:0};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function uid(){return crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function day(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function defaults(){return {v:2,cards:[],plans:[],diary:[],history:[],settings:{cap:24,theme:'#52775b',reminder:false},meta:{created:Date.now()}}}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore(STORE);d.createObjectStore(IMG)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function idb(store,key,val){const db=await openDB();return new Promise((resolve,reject)=>{const t=db.transaction(store,val===undefined?'readonly':'readwrite').objectStore(store);const r=val===undefined?t.get(key):t.put(val,key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function allImages(){const db=await openDB();return new Promise((resolve,reject)=>{const r=db.transaction(IMG).objectStore(IMG).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function save(){await idb(STORE,'state',state)}
function dataToBlob(url){const [h,b]=url.split(',');const mime=(h.match(/:(.*?);/)||[])[1]||'image/jpeg';const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}
async function migrate(){const old=localStorage.getItem(LEGACY);if(!old)return defaults();try{const x=JSON.parse(old),n=defaults();n.cards=(x.cards||[]).map(c=>({id:c.id||uid(),subject:c.subject||'未分类',chapter:c.chapter||'',tags:c.tags||'',front:c.question||'',back:c.answer||'',frontImageId:'',backImageId:'',mastery:c.score||0,ease:2.35,interval:0,reps:c.reviews||0,due:c.due||day(),created:c.created||day()}));n.plans=(x.plans||[]).map(p=>({id:p.id||uid(),mode:p.mode||'day',scope:p.scope||p.key||p.date||day(),date:p.date||day(),text:p.text||'',color:p.color||'#e2f0df',done:!!p.done}));n.diary=x.diary||[];n.history=x.history||[];for(const [i,c] of (x.cards||[]).entries()){for(const side of ['front','back']){const raw=side==='front'?(c.frontImage||c.sourceImage):(c.backImage||'');if(raw&&raw.startsWith('data:')){const key=n.cards[i].id+'-'+side;await idb(IMG,key,dataToBlob(raw));n.cards[i][side+'ImageId']=key}}}return n}catch(e){return defaults()}}
async function boot(){state=await idb(STORE,'state');if(!state){state=await migrate();await save()}applyTheme();renderAll();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');scheduleReminder()}
function applyTheme(){document.documentElement.style.setProperty('--green',state.settings.theme||'#52775b');document.querySelector('meta[name="theme-color"]').content=state.settings.theme||'#52775b'}
function go(id,btn){$$('.page').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on');$$('.nav').forEach(x=>x.classList.remove('on'));if(btn)btn.classList.add('on');if(id==='home')renderHome();if(id==='review')renderReview();if(id==='cards')renderCards();if(id==='report')renderReport();if(id==='diary')renderDiary();if(id==='plans')renderPlans()}
function cardsDue(){return state.cards.filter(c=>c.due<=day()).sort((a,b)=>(a.mastery-b.mastery)||String(a.due).localeCompare(String(b.due)))}
function todayReviews(){return state.history.filter(h=>h.date===day())}
function quote(){const a=['小脑袋今天也来上班','努力加载中的考研人','认真但有点困的你','把难题瞪回去的同学','偷偷变厉害的你','想躺平又坐回来的你','会把不会变成会的你'];const b=['先拿下一小块，剩下的明天再收拾','不需要一下变超人，认真五分钟也很厉害','每一次复习都在给上岸碎片攒亮光','今天的努力会在考场举手说“我会”','慢一点没关系，方向对就已经很酷','把目标切小一点，像吃薯片一样一口一口来','请把“我不行”换成“我再看一眼”'];const i=Math.floor((Date.now()+28800000)/86400000);return a[i%a.length]+'：'+b[i%b.length]+'。'}
function renderHome(){const due=cardsDue(),avg=state.cards.length?Math.round(state.cards.reduce((s,c)=>s+c.mastery,0)/state.cards.length):0,done=todayReviews().length,candy='🍬'.repeat(Math.min(3,done))+'▫️'.repeat(Math.max(0,3-done)),weak=state.cards.filter(c=>c.mastery<45).length;$('#home').innerHTML='<div class="top"><div><p class="ey">今日 · '+new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric'})+'</p><h1>早上好，慢慢来也会到达。</h1></div><button class="textBtn" onclick="drawBlind()">抽卡盲盒</button></div><div class="hero"><div><p class="ey">今日的一点点鼓励</p><h2>'+esc(quote())+'</h2><p class="tiny">今日待复习 '+due.length+' 张 · 默认安排 '+Math.min(due.length,state.settings.cap)+' 张</p><button class="btn" onclick="go(\'review\')">开始今日复习 →</button></div><div class="ring" style="--p:'+avg+'%">'+avg+'%</div></div><div class="creative"><div class="box"><p class="ey">今日三颗糖</p><div class="candy">'+candy+'</div><span class="tiny">完成 3 次复习，就给今天一个小红花。</span></div><div class="box"><p class="ey">记忆温度计</p><b class="big">'+avg+'°</b><span class="tiny">'+(avg<35?'微凉，先从一张卡暖起来。':avg<70?'暖暖的，保持这个节奏。':'很热乎，知识点在发光。')+'</span></div><div class="box"><p class="ey">薄弱点小怪兽</p><div class="monster">'+(weak?'👾':'🌱')+'</div><span class="tiny">'+(weak?'还有 '+weak+' 张低掌握卡，复习一次它就会缩小。':'小怪兽暂时躲起来啦。')+'</span></div></div><section class="blind"><p class="ey">今日卡片盲盒</p><h3>不看答案，抽一张和知识偶遇。</h3><button class="btn alt" onclick="drawBlind()">✨ 随机抽一张</button><div id="blindResult" class="blind-card"><span class="tiny">盲盒不会影响正常复习安排。</span></div></section><div class="grid"><div class="box"><span class="tiny">已录入</span><b class="big">'+state.cards.length+' 张</b></div><div class="box"><span class="tiny">今日已复习</span><b class="big">'+done+' 次</b></div><div class="box"><span class="tiny">连续努力</span><b class="big">'+streak()+' 天</b></div></div><div class="box"><p class="ey">本周最努力瞬间</p><b>'+weeklySummary()+'</b></div>'}
function streak(){let n=0,d=new Date();while(state.history.some(h=>h.date===day(d))){n++;d=addDays(d,-1)}return n}
function weeklySummary(){const n=state.history.filter(h=>h.date>=day(addDays(new Date(),-6))).length;return n?'这周已经完成 '+n+' 次复习，未来的你正在收到这份礼物。':'这一周从第一张卡开始，也会有故事。'}
function drawBlind(){if(!state.cards.length){go('cards');return}const c=state.cards[Math.floor(Math.random()*state.cards.length)],box=$('#blindResult');if(!box)return;box.innerHTML='<p class="ey">'+esc(c.subject)+(c.chapter?' · '+esc(c.chapter):'')+'</p><div data-img="'+c.frontImageId+'"></div><h3>'+esc(c.front||'请查看正面图片')+'</h3><button class="textBtn" onclick="revealBlind(\''+c.id+'\')">翻开背面</button><div id="blindBack" class="answer"></div>';hydrate(box)}
function revealBlind(id){const c=state.cards.find(x=>x.id===id),el=$('#blindBack');el.style.display='block';el.innerHTML='<div data-img="'+c.backImageId+'"></div><b>'+esc(c.back||'请查看背面图片')+'</b>';hydrate(el)}
async function hydrate(root){for(const el of root.querySelectorAll('[data-img]')){const id=el.dataset.img;if(!id)continue;const b=await idb(IMG,id);if(b){const im=document.createElement('img');im.src=URL.createObjectURL(b);el.appendChild(im)}}}
function queue(){const all=cardsDue();return extraMode?all:all.slice(0,state.settings.cap)}
function renderReview(){const q=queue(),c=q[0];if(!c){$('#review').innerHTML='<p class="ey">今日复习</p><h1>今天安排的复习完成啦。</h1><div class="empty"><b>做得很好。</b>想多学一点可以开启加练，或去内容库录入新卡。</div><p><button class="btn" onclick="extraMode=true;renderReview()">开启加练</button></p>';return}activeCardId=c.id;$('#review').innerHTML='<p class="ey">今日复习 · '+q.length+' 张待完成</p><h1>慢慢回想，不用着急。</h1><div class="quote">✦ '+esc(quote())+'</div><div class="review-card"><span class="ey">'+esc(c.subject)+(c.chapter?' · '+esc(c.chapter):'')+'</span><div data-img="'+c.frontImageId+'"></div><h2>'+esc(c.front||'请查看正面图片')+'</h2><button class="btn" onclick="showAnswer()">点击查看答案</button><div id="reviewAnswer" class="answer"></div></div><div id="rate" class="rate" style="display:none"><p>这张卡掌握得怎么样？</p><button onclick="grade(5)">我会了</button><button onclick="grade(3)">有点模糊</button><button onclick="grade(1)">还不会</button></div><p class="tiny" style="text-align:center"><button class="textBtn" onclick="extraMode=!extraMode;renderReview()">'+(extraMode?'恢复今日安排':'我想多学一点')+'</button></p>';hydrate($('#review'))}
function showAnswer(){const c=state.cards.find(x=>x.id===activeCardId),a=$('#reviewAnswer');a.style.display='block';a.innerHTML='<div data-img="'+c.backImageId+'"></div><b>'+esc(c.back||'请查看背面图片')+'</b>';hydrate(a);$('#rate').style.display='block'}
async function grade(quality){const c=state.cards.find(x=>x.id===activeCardId);let interval=c.interval||0,ease=c.ease||2.35;if(quality<=1){interval=1;ease=Math.max(1.3,ease-.2);c.reps=0}else if(quality===3){interval=Math.max(1,Math.round(interval*.75)||1);ease=Math.max(1.3,ease-.08);c.reps=(c.reps||0)+1}else{c.reps=(c.reps||0)+1;interval=c.reps===1?1:c.reps===2?3:Math.max(4,Math.round((interval||3)*ease));ease=Math.min(3.2,ease+.08)}c.interval=interval;c.ease=ease;c.mastery=Math.round(Math.max(0,Math.min(100,(c.mastery||0)*.68+quality/5*100*.32)));c.due=day(addDays(new Date(),interval));state.history.push({id:uid(),date:day(),cardId:c.id,quality,mastery:c.mastery});await save();renderReview()}
function renderCards(){const subjects=[...new Set(state.cards.map(c=>c.subject).filter(Boolean))],chapters=[...new Set(state.cards.map(c=>c.chapter).filter(Boolean))],selected=$('#cardSubject')?.value||'',query=$('#cardSearch')?.value||'';let cards=state.cards.filter(c=>(!selected||c.subject===selected)&&(!query||(c.front+c.back+c.tags).toLowerCase().includes(query.toLowerCase())));$('#cards').innerHTML='<div class="top"><div><p class="ey">内容库 · 图片存入本地数据库</p><h1>把要背的，收进心记。</h1></div><button class="textBtn" onclick="newCard()">＋ 新建卡片</button></div><div id="cardEditor"></div><div class="filters"><input id="cardSearch" class="search" placeholder="搜索内容或标签" oninput="renderCards()"><select id="cardSubject" onchange="renderCards()"><option value="">全部科目</option>'+subjects.map(x=>'<option '+(x===selected?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></div><div class="box"><p class="ey">分类浏览</p>'+subjects.map(s=>'<span class="pill">'+esc(s)+' · '+state.cards.filter(c=>c.subject===s).length+'</span>').join('')+(chapters.length?'<p class="tiny">章节：'+chapters.map(esc).join('、')+'</p>':'')+'</div><div class="box" style="margin-top:12px">'+(cards.length?cards.map(c=>'<div class="card-row"><div class="thumbs"><div data-img="'+c.frontImageId+'"></div><div data-img="'+c.backImageId+'"></div></div><div class="content"><b>'+esc(c.subject||'未分类')+(c.chapter?' · '+esc(c.chapter):'')+'</b><p>'+esc(c.front||'图片卡片')+'</p><span class="tiny">'+esc(c.tags||'')+' · 掌握度 '+c.mastery+'%</span><div class="actions"><button class="textBtn" onclick="editCard(\''+c.id+'\')">编辑</button><button class="textBtn danger" onclick="removeCard(\''+c.id+'\')">删除</button></div></div></div>').join(''):'<div class="empty"><b>还没有卡片</b>可以手动写，也可以从图库或相机导入正反面。</div>')+'</div>';hydrate($('#cards'))}
function newCard(){cardDraft={front:null,back:null,frontUrl:'',backUrl:'',editing:null};cardEditor()}
function editCard(id){const c=state.cards.find(x=>x.id===id);cardDraft={front:null,back:null,frontUrl:'',backUrl:'',editing:c};cardEditor(c)}
function cardEditor(c=cardDraft.editing){$('#cardEditor').innerHTML='<div class="box" style="margin:16px 0"><div class="sectionHead"><h3>'+ (c?'编辑卡片':'新增双面卡片')+'</h3><button class="textBtn" onclick="$(\'#cardEditor\').innerHTML=\'\'">收起</button></div><div class="form"><input id="fSubject" placeholder="科目，例如：英语" value="'+esc(c?.subject||'')+'"><input id="fChapter" placeholder="章节，例如：核心词汇" value="'+esc(c?.chapter||'')+'"><input class="wide" id="fTags" placeholder="标签，用空格分开" value="'+esc(c?.tags||'')+'"><textarea class="wide" id="fFront" placeholder="正面文字：拍照识别后会自动填入">'+esc(c?.front||'')+'</textarea><textarea class="wide" id="fBack" placeholder="背面文字：拍照识别后会自动填入">'+esc(c?.back||'')+'</textarea><div class="wide photo-pair"><div class="photo"><label for="frontFile">📷 相机 / 图库：正面</label><input id="frontFile" type="file" accept="image/*" onchange="pickPhoto(this,\'front\')"><div id="frontPreview"></div><span id="frontMsg" class="tiny">图片和识别文字会一起保存。</span></div><div class="photo"><label for="backFile">📷 相机 / 图库：背面</label><input id="backFile" type="file" accept="image/*" onchange="pickPhoto(this,\'back\')"><div id="backPreview"></div><span id="backMsg" class="tiny">图片和识别文字会一起保存。</span></div></div></div><p><button class="btn" onclick="saveCard()">保存卡片</button></p></div>';if(c){showStoredPreview('front',c.frontImageId);showStoredPreview('back',c.backImageId)}}
async function showStoredPreview(side,id){if(!id)return;const b=await idb(IMG,id);if(b)$('#'+side+'Preview').innerHTML='<img src="'+URL.createObjectURL(b)+'">'}
function compress(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=1280,s=Math.min(1,max/Math.max(im.width,im.height)),can=document.createElement('canvas');can.width=im.width*s;can.height=im.height*s;can.getContext('2d').drawImage(im,0,0,can.width,can.height);can.toBlob(b=>resolve(b),'image/jpeg',.7)};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
let ocrLoad;
function loadOCR(){if(window.Tesseract)return Promise.resolve(window.Tesseract);if(ocrLoad)return ocrLoad;ocrLoad=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=()=>resolve(window.Tesseract);s.onerror=reject;document.head.appendChild(s)});return ocrLoad}
async function pickPhoto(input,side){const f=input.files[0];if(!f)return;const msg=$('#'+side+'Msg');msg.textContent='正在处理图片…';try{const b=await compress(f),url=URL.createObjectURL(b);cardDraft[side]=b;cardDraft[side+'Url']=url;$('#'+side+'Preview').innerHTML='<img src="'+url+'">';let text='';if('TextDetector'in window){const im=new Image();im.src=url;await im.decode();text=(await new TextDetector().detect(im)).map(x=>x.rawValue).join('\\n')}else{msg.textContent='首次识别需下载中文组件…';const T=await loadOCR(),r=await T.recognize(url,'chi_sim+eng');text=r.data.text}const field=$('#'+(side==='front'?'fFront':'fBack'));if(text.trim()&&!field.value)field.value=text.trim();msg.textContent=text.trim()?'已识别，可手动修改。':'图片已保存，未识别到清晰文字。'}catch(e){msg.textContent='图片可保存，但识别暂不可用；请手动填写文字。'}}
async function saveCard(){const old=cardDraft.editing,front=$('#fFront').value.trim(),back=$('#fBack').value.trim();if(!front&&!cardDraft.front&&!old?.frontImageId){alert('请添加卡片正面');return}if(!back&&!cardDraft.back&&!old?.backImageId){alert('请添加卡片背面');return}const c=old||{id:uid(),mastery:0,ease:2.35,interval:0,reps:0,due:day(),created:day()};c.subject=$('#fSubject').value.trim()||'未分类';c.chapter=$('#fChapter').value.trim();c.tags=$('#fTags').value.trim();c.front=front||'请查看正面图片';c.back=back||'请查看背面图片';for(const side of ['front','back'])if(cardDraft[side]){const key=c.id+'-'+side;await idb(IMG,key,cardDraft[side]);c[side+'ImageId']=key}if(!old)state.cards.unshift(c);await save();renderCards()}
async function removeCard(id){if(!confirm('确定删除这张卡吗？'))return;state.cards=state.cards.filter(c=>c.id!==id);await save();renderCards()}
function renderReport(){const hist=state.history||[],cards=state.cards,avg=cards.length?Math.round(cards.reduce((s,c)=>s+c.mastery,0)/cards.length):0,days=[];for(let i=27;i>=0;i--)days.push(day(addDays(new Date(),-i)));const count={};hist.forEach(h=>count[h.date]=(count[h.date]||0)+1);const recent=days.slice(-14),max=Math.max(1,...recent.map(d=>count[d]||0)),master=cards.filter(c=>c.mastery>=75).length,weak=cards.filter(c=>c.mastery<45).length,groups={};cards.forEach(c=>(groups[c.subject]||(groups[c.subject]=[])).push(c));$('#report').innerHTML='<p class="ey">学习报告 · 真实记录会慢慢开花</p><h1>你的努力，有迹可循。</h1><div class="analytics"><div class="box"><p class="ey">近 14 天复习频率</p><div class="bars">'+recent.map(d=>'<i style="height:'+Math.max(3,(count[d]||0)/max*125)+'px;background:'+(count[d]?'#8fba92':'#edf1ec')+'"></i>').join('')+'</div><p class="tiny">累计 '+hist.length+' 次复习</p></div><div class="box"><p class="ey">总体掌握度</p><div class="mini-ring" style="--p:'+avg+'%">'+avg+'%</div><p class="tiny" style="text-align:center">根据每次评价与间隔动态计算</p></div></div><div class="analytics" style="margin-top:14px"><div class="box"><p class="ey">掌握分布</p><p>已掌握 '+master+' 张</p><div class="bar"><i style="width:'+(cards.length?master/cards.length*100:0)+'%"></i></div><p>待巩固 '+(cards.length-master-weak)+' 张</p><div class="bar"><i style="width:'+(cards.length?(cards.length-master-weak)/cards.length*100:0)+'%;background:#dfbd8b"></i></div><p>薄弱卡 '+weak+' 张</p><div class="bar"><i style="width:'+(cards.length?weak/cards.length*100:0)+'%;background:#d6a0a0"></i></div></div><div class="box"><p class="ey">近 28 天学习热力</p><div class="heat">'+days.map(d=>{const n=count[d]||0;return '<i title="'+d+' · '+n+' 次" style="background:'+(n===0?'#edf1ec':n===1?'#d8ecd6':n<4?'#a6cda6':'#6f9d74')+'"></i>'}).join('')+'</div></div></div><div class="box" style="margin-top:14px"><p class="ey">科目掌握度</p>'+Object.entries(groups).map(([n,a])=>{const p=Math.round(a.reduce((s,c)=>s+c.mastery,0)/a.length);return '<div class="subject-row"><div><b>'+esc(n)+'</b><div class="tiny">'+a.length+' 张</div></div><div style="width:150px"><div class="bar"><i style="width:'+p+'%"></i></div><div class="tiny" style="text-align:right">'+p+'%</div></div></div>'}).join('')+(cards.length?'':'<div class="empty"><b>还没有分析数据</b>保存卡片并完成复习后，图表就会出现。</div>')+'</div>'}
function renderDiary(){const ds=state.diary||[];$('#diary').innerHTML='<p class="ey">复习日记 · 把今天也好好收藏</p><h1>记录一点点，也是在看见自己。</h1><div class="quote">✦ 今天没有白费力气，你是在给未来的自己偷偷充电。</div><div class="form"><textarea class="wide" id="diaryText" placeholder="今天记住了什么？有什么小小的心情或收获？"></textarea><button class="btn" onclick="saveDiary(\'diary\')">收藏今天的日记</button></div><div class="box" style="margin-top:16px"><p class="ey">给未来自己的信</p><textarea id="letterText" placeholder="写给未来上岸的自己，或下周的自己。"></textarea><p><button class="btn light" onclick="saveDiary(\'letter\')">投进倒计时信箱</button></p></div><div class="sectionHead"><h3>我的记录</h3></div>'+(ds.length?ds.map(x=>'<div class="diary-entry"><span class="ey">'+esc(x.date)+(x.type==='letter'?' · 未来信箱':'')+'</span><p>'+esc(x.text)+'</p></div>').join(''):'<div class="empty"><b>第一篇记录在等你</b>完成复习后写一句，就很好。</div>')}
async function saveDiary(type){const el=$('#'+(type==='letter'?'letterText':'diaryText')),text=el.value.trim();if(!text)return;state.diary.unshift({id:uid(),date:day(),type,text});await save();renderDiary()}
function startOf(mode,d){const x=new Date(d);if(mode==='week')x.setDate(x.getDate()-(x.getDay()+6)%7);if(mode==='month')x.setDate(1);if(mode==='year')x.setMonth(0,1);return x}
function scope(mode,d){const x=startOf(mode,d);return mode==='day'?day(x):mode==='week'?day(x):mode==='month'?x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'):String(x.getFullYear())}
function records(mode,s,date){return state.plans.filter(p=>p.mode===mode&&p.scope===s&&p.date===date)}
function shiftPlan(n){if(planMode==='day')planFocus=addDays(planFocus,n);if(planMode==='week')planFocus=addDays(planFocus,n*7);if(planMode==='month')planFocus=new Date(planFocus.getFullYear(),planFocus.getMonth()+n,1);if(planMode==='year')planFocus=new Date(planFocus.getFullYear()+n,0,1);renderPlans()}
function planTask(p){return '<div class="plan-task '+(p.done?'done':'')+'" style="background:'+p.color+'" onclick="togglePlan(\''+p.id+'\')">'+(p.done?'✓ ':'')+esc(p.text)+'</div>'}
function renderPlans(){const f=startOf(planMode,planFocus),s=scope(planMode,f),end=planMode==='week'?addDays(f,6):planMode==='month'?new Date(f.getFullYear(),f.getMonth()+1,0):f;let title=planMode==='day'?day(f):planMode==='week'?(f.getMonth()+1)+' 月 '+f.getDate()+' 日 — '+(end.getMonth()+1)+' 月 '+end.getDate()+' 日':planMode==='month'?f.getFullYear()+' 年 '+(f.getMonth()+1)+' 月':f.getFullYear()+' 年';let min=day(f),max=planMode==='week'?day(end):planMode==='month'?day(end):planMode==='year'?f.getFullYear()+'-12-31':min,view='';if(planMode==='day'){view='<div class="box">'+(records('day',s,min).map(p=>'<div class="subject-row"><button class="textBtn" onclick="togglePlan(\''+p.id+'\')">'+(p.done?'✓':'○')+'</button><div style="flex:1">'+esc(p.text)+'</div></div>').join('')||'<div class="empty"><b>这一天没有计划</b>可用左右按钮查看以前的日计划。</div>')+'</div>'}if(planMode==='week'){let cells='';for(let i=0;i<7;i++){const d=addDays(f,i),k=day(d);cells+='<div class="plan-cell '+(k===day()?'today':'')+'"><b>'+['周一','周二','周三','周四','周五','周六','周日'][i]+'</b><div class="tiny">'+(d.getMonth()+1)+' 月 '+d.getDate()+' 日</div>'+records('week',s,k).map(planTask).join('')+'<button class="add-cell" onclick="setPlanDate(\''+k+'\')">＋ 添加</button></div>'}view='<div class="scroll"><div class="week-grid">'+cells+'</div></div>'}if(planMode==='month'){let cells='',offset=(f.getDay()+6)%7;for(let i=0;i<42;i++){const d=addDays(f,i-offset),k=day(d),valid=d.getMonth()===f.getMonth();cells+='<div class="plan-cell '+(valid?'':'muted ')+'"><b>'+d.getDate()+'</b>'+(valid?records('month',s,k).map(planTask).join('')+'<button class="add-cell" onclick="setPlanDate(\''+k+'\')">＋ 添加</button>':'')+'</div>'}view='<div class="scroll"><div class="month-grid">'+cells+'</div></div>'}if(planMode==='year'){let months='';for(let m=0;m<12;m++){const k=f.getFullYear()+'-'+String(m+1).padStart(2,'0');months+='<div class="plan-cell"><b>'+(m+1)+' 月</b>'+records('year',s,k).map(planTask).join('')+'<button class="add-cell" onclick="setPlanDate(\''+k+'\')">＋ 添加目标</button></div>'}view='<div class="year-grid">'+months+'</div>'}const hist=state.plans.filter(p=>p.mode===planMode).sort((a,b)=>String(b.date).localeCompare(String(a.date))),pg=historyPages[planMode]||0,chunk=hist.slice(pg*6,pg*6+6),pages=Math.max(1,Math.ceil(hist.length/6));$('#plans').innerHTML='<p class="ey">学习计划 · 每一段努力都能翻回来看</p><h1>有方向地努力，也有余裕地生活。</h1><div class="mode">'+['day','week','month','year'].map(m=>'<button class="'+(m===planMode?'on':'')+'" onclick="planMode=\''+m+'\';renderPlans()">'+({day:'日计划',week:'周计划',month:'月计划',year:'年计划'}[m])+'</button>').join('')+'</div><div class="period"><button onclick="shiftPlan(-1)">← 上一期</button><strong>'+title+'</strong><button onclick="planFocus=new Date();renderPlans()">回到现在</button><button onclick="shiftPlan(1)">下一期 →</button></div><div class="plan-form"><input id="planDate" type="'+(planMode==='year'?'month':'date')+'" value="'+(planMode==='year'?f.getFullYear()+'-01':min)+'" min="'+(planMode==='year'?f.getFullYear()+'-01':min)+'" max="'+(planMode==='year'?f.getFullYear()+'-12':max)+'"><input id="planText" placeholder="添加一条'+({day:'日',week:'周',month:'月',year:'年'}[planMode])+'计划"><select id="planColor"><option value="#e2f0df">绿色</option><option value="#f9e6d5">杏色</option><option value="#e6e3f5">紫色</option></select><button class="btn" onclick="savePlan()">添加</button></div>'+view+'<div class="history"><p class="ey">往期'+({day:'日',week:'周',month:'月',year:'年'}[planMode])+'计划</p>'+(chunk.length?chunk.map(p=>'<div class="history-row"><time>'+esc(p.date)+'</time><span>'+ (p.done?'✓ ':'')+esc(p.text)+'</span></div>').join(''):'<p class="tiny">暂无历史记录。</p>')+'<div class="pager"><button onclick="historyPages[planMode]=Math.max(0,(historyPages[planMode]||0)-1);renderPlans()">上一页</button><span class="tiny">'+(pg+1)+' / '+pages+' 页</span><button onclick="historyPages[planMode]=Math.min(pages-1,(historyPages[planMode]||0)+1);renderPlans()">下一页</button></div></div>'}
function setPlanDate(v){$('#planDate').value=v;$('#planText').focus()}
async function savePlan(){const date=$('#planDate').value,text=$('#planText').value.trim();if(!text)return;state.plans.unshift({id:uid(),mode:planMode,scope:scope(planMode,new Date((date.length===7?date+'-01':date)+'T12:00:00')),date,text,color:$('#planColor').value,done:false});await save();renderPlans()}
async function togglePlan(id){const p=state.plans.find(x=>x.id===id);p.done=!p.done;await save();renderPlans()}
async function exportData(){const imgs=await allImages(),payload={state,images:[]};for(const b of imgs){payload.images.push(await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)}))}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload)],{type:'application/json'}));a.download='xinji-backup-'+day()+'.json';a.click()}
function importData(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const x=JSON.parse(r.result);if(!x.state)throw 0;state=x.state;for(let i=0;i<(x.images||[]).length;i++)await idb(IMG,'import-'+i,dataToBlob(x.images[i]));await save();alert('备份已导入。');renderAll()}catch(e){alert('备份文件无法读取。')}};r.readAsText(f)}
async function reminders(){if(!('Notification'in window))return;const p=await Notification.requestPermission();state.settings.reminder=p==='granted';await save();scheduleReminder();alert(p==='granted'?'提醒已开启：打开心记时会检查今日复习。':'未获得提醒权限。')}
function scheduleReminder(){if(state?.settings?.reminder&&cardsDue().length&&Notification.permission==='granted')setTimeout(()=>new Notification('心记提醒',{body:'今天还有 '+Math.min(cardsDue().length,state.settings.cap)+' 张卡等待复习。'}),2500)}
function renderAll(){renderHome();renderReview();renderCards();renderReport();renderDiary();renderPlans()}
function renderMore(){ }
boot();
</script>

<script>
let deferredInstall;
